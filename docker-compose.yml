version: '3'

services:

  anilines_backend:
    image: "${BACKEND_IMAGE:?is not set; deploy with ../scripts/deploy-library.sh}"
    environment:
      POSTGRES_SERVER: descriptor_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWD: "${POSTGRES_PASSWD:?is not set, expected from ../.env.secrets via the .env link in this folder}"
      POSTGRES_DB: aniline_data
      API_PREFIX: anilines
    entrypoint: bash prestart.sh
    networks:
      - external_network
      - descriptor-libraries-internal
    labels:
      - traefik.enable=true
      - traefik.http.services.descriptor_libraries-anilines_backend.loadbalancer.server.port=8080
      - "traefik.http.routers.descriptor_libraries-anilines_backend.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/api/anilines`))"
      - traefik.http.routers.descriptor_libraries-anilines_backend.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-anilines_backend.tls.certresolver=letsencrypt

  anilines_frontend:
    image: "${FRONTEND_IMAGE:?is not set; deploy with ../scripts/deploy-library.sh}"
    volumes:
      - "./public:/app/public"
    environment:
      - VITE_BASE_URL=/anilines
    networks:
      - external_network
    entrypoint: ash renameBase.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.descriptor_libraries-frontend-anilines.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/anilines`))"
      - "traefik.http.services.descriptor_libraries-frontend-anilines.loadbalancer.server.port=3000"
      - traefik.http.routers.descriptor_libraries-frontend-anilines.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-frontend-anilines.tls.certresolver=letsencrypt

networks:
  external_network:
    # external = handled outside of this docker compose
    name: docker_main_net
    external: true
  descriptor-libraries-internal:
    external: true
